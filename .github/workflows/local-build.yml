name: Local code quality (no deployment)
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore CashFlow.slnx
      - run: dotnet build CashFlow.slnx --configuration Release --no-restore
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
