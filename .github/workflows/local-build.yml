name: Build, tests and SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: cashflow-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend | Build and tests
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cashflow_transactions_test
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow -d cashflow_transactions_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: cashflow
          RABBITMQ_DEFAULT_PASS: local_ci_only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Backend | Restore
        run: dotnet restore CashFlow.slnx

      - name: Backend | Prepare isolated Consolidation test database
        env:
          PGPASSWORD: local_ci_only
        run: psql -h localhost -p 5432 -U cashflow -d postgres -c "CREATE DATABASE cashflow_consolidation_test;"

      - name: Backend | Build .NET 10
        run: dotnet build CashFlow.slnx -c Release --no-restore

      - name: Backend | Verify Transactions Docker image build
        run: docker build -f src/Services/Transactions/Dockerfile -t cashflow-transactions:ci .

      - name: Backend | Verify Consolidation Docker image build
        run: docker build -f src/Services/Consolidation/Dockerfile -t cashflow-consolidation:ci .

      - name: Backend | Architecture tests
        run: dotnet test tests/CashFlow.ArchitectureTests/CashFlow.ArchitectureTests.csproj -c Release --no-build

      - name: Backend | Transactions Domain (min 80% lines)
        run: dotnet test tests/CashFlow.Transactions.UnitTests/CashFlow.Transactions.UnitTests.csproj -c Release --no-build /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=Minimum '/p:Include=[CashFlow.Transactions.Domain]*' /p:CoverletOutputFormat=cobertura

      - name: Backend | Transactions Application (min 80% lines)
        run: dotnet test tests/CashFlow.Transactions.UnitTests/CashFlow.Transactions.UnitTests.csproj -c Release --no-build /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=Minimum '/p:Include=[CashFlow.Transactions.Application]*' /p:CoverletOutputFormat=cobertura

      - name: Backend | JWT authentication API tests
        run: dotnet test tests/CashFlow.Transactions.ApiTests/CashFlow.Transactions.ApiTests.csproj -c Release --no-build

      - name: Backend | PostgreSQL integration and Infrastructure coverage (min 80% lines)
        env:
          CASHFLOW_TEST_POSTGRES: Host=localhost;Port=5432;Database=cashflow_transactions_test;Username=cashflow;Password=local_ci_only
          CASHFLOW_TEST_RABBITMQ: "true"
        run: dotnet test tests/CashFlow.Transactions.IntegrationTests/CashFlow.Transactions.IntegrationTests.csproj -c Release --no-build /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=Minimum '/p:Include=[CashFlow.Transactions.Infrastructure]*' /p:CoverletOutputFormat=cobertura

      - name: Backend | Consolidation unit tests and Domain coverage (min 80%)
        run: dotnet test tests/CashFlow.Consolidation.UnitTests/CashFlow.Consolidation.UnitTests.csproj -c Release --no-build /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=Minimum '/p:Include=[CashFlow.Consolidation.Domain]*' /p:CoverletOutputFormat=cobertura

      - name: Backend | Consolidation Application coverage (min 80%)
        run: dotnet test tests/CashFlow.Consolidation.UnitTests/CashFlow.Consolidation.UnitTests.csproj -c Release --no-build /p:CollectCoverage=true /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=Minimum '/p:Include=[CashFlow.Consolidation.Application]*' /p:CoverletOutputFormat=cobertura

      - name: Backend | Consolidation PostgreSQL integration tests
        env:
          CASHFLOW_TEST_CONSOLIDATION: Host=localhost;Port=5432;Database=cashflow_consolidation_test;Username=cashflow;Password=local_ci_only
          CASHFLOW_TEST_RABBITMQ: "true"
        run: dotnet test tests/CashFlow.Consolidation.IntegrationTests/CashFlow.Consolidation.IntegrationTests.csproj -c Release --no-build

      - name: Backend | Consolidation HTTP API tests
        run: dotnet test tests/CashFlow.Consolidation.ApiTests/CashFlow.Consolidation.ApiTests.csproj -c Release --no-build

      - name: Backend | Generate OpenCover for Sonar
        run: |
          dotnet test tests/CashFlow.Transactions.UnitTests/CashFlow.Transactions.UnitTests.csproj \
            -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/sonar/coverage.unit.opencover.xml

      - name: Backend | Generate integration OpenCover for Sonar
        env:
          CASHFLOW_TEST_POSTGRES: Host=localhost;Port=5432;Database=cashflow_transactions_test;Username=cashflow;Password=local_ci_only
          CASHFLOW_TEST_RABBITMQ: "true"
        run: |
          dotnet test tests/CashFlow.Transactions.IntegrationTests/CashFlow.Transactions.IntegrationTests.csproj \
            -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/sonar/coverage.integration.opencover.xml

      - name: Backend | Generate JWT API OpenCover for Sonar
        run: |
          dotnet test tests/CashFlow.Transactions.ApiTests/CashFlow.Transactions.ApiTests.csproj \
            -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/sonar/coverage.api.opencover.xml

      - name: Backend | Generate Consolidation unit OpenCover for Sonar
        run: |
          dotnet test tests/CashFlow.Consolidation.UnitTests/CashFlow.Consolidation.UnitTests.csproj \
            -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/sonar/coverage.consolidation-unit.opencover.xml

      - name: Backend | Generate Consolidation integration OpenCover for Sonar
        env:
          CASHFLOW_TEST_CONSOLIDATION: Host=localhost;Port=5432;Database=cashflow_consolidation_test;Username=cashflow;Password=local_ci_only
          CASHFLOW_TEST_RABBITMQ: "true"
        run: |
          dotnet test tests/CashFlow.Consolidation.IntegrationTests/CashFlow.Consolidation.IntegrationTests.csproj \
            -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/sonar/coverage.consolidation-integration.opencover.xml

      - name: Backend | Generate Consolidation HTTP OpenCover for Sonar
        run: |
          dotnet test tests/CashFlow.Consolidation.ApiTests/CashFlow.Consolidation.ApiTests.csproj \
            -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/sonar/coverage.consolidation-api.opencover.xml

      - name: Backend | Assemble OpenCover reports
        run: |
          mkdir -p sonar-reports/backend
          cp tests/CashFlow.Transactions.UnitTests/TestResults/sonar/coverage.unit.opencover.xml sonar-reports/backend/
          cp tests/CashFlow.Transactions.IntegrationTests/TestResults/sonar/coverage.integration.opencover.xml sonar-reports/backend/
          cp tests/CashFlow.Transactions.ApiTests/TestResults/sonar/coverage.api.opencover.xml sonar-reports/backend/
          cp tests/CashFlow.Consolidation.UnitTests/TestResults/sonar/coverage.consolidation-unit.opencover.xml sonar-reports/backend/
          cp tests/CashFlow.Consolidation.IntegrationTests/TestResults/sonar/coverage.consolidation-integration.opencover.xml sonar-reports/backend/
          cp tests/CashFlow.Consolidation.ApiTests/TestResults/sonar/coverage.consolidation-api.opencover.xml sonar-reports/backend/

      - name: Backend | Upload OpenCover
        uses: actions/upload-artifact@v4
        with:
          name: backend-opencover
          path: sonar-reports/backend/*.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend | Build and tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend | Install packages
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Frontend | Build TypeScript and Vite
        working-directory: web
        run: npm run build

      - name: Frontend | Vitest and coverage (min 80%)
        working-directory: web
        run: npm run test:coverage

      - name: Frontend | Upload LCOV
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lcov
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: Sonar | Backend and frontend
    permissions:
      contents: read
      pull-requests: read
    needs: [backend, frontend]
    # GitHub does not pass repository secrets to workflows triggered by fork PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sonar backend | Download OpenCover
        uses: actions/download-artifact@v4
        with:
          name: backend-opencover
          path: sonar-reports/backend

      - name: Sonar frontend | Download LCOV
        uses: actions/download-artifact@v4
        with:
          name: frontend-lcov
          path: web/coverage

      - name: Sonar backend | Verify both coverage reports
        run: |
          test -s sonar-reports/backend/coverage.unit.opencover.xml
          test -s sonar-reports/backend/coverage.integration.opencover.xml
          test -s sonar-reports/backend/coverage.api.opencover.xml
          test -s sonar-reports/backend/coverage.consolidation-unit.opencover.xml
          test -s sonar-reports/backend/coverage.consolidation-integration.opencover.xml
          test -s sonar-reports/backend/coverage.consolidation-api.opencover.xml

      - name: Sonar frontend | Verify coverage report
        run: test -s web/coverage/lcov.info

      - name: Sonar frontend | Restore TypeScript dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sonar | Validate project credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        shell: bash
        run: |
          for name in SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure GitHub Actions repository secret $name."
              exit 1
            fi
          done

      - name: Sonar | Install .NET scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Sonar backend | Begin C# and TypeScript analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        shell: bash
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.cs.opencover.reportsPaths="sonar-reports/backend/coverage.*.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="web/coverage/lcov.info" \
            /d:sonar.coverage.exclusions=".github/scripts/**" \
            /d:sonar.cpd.exclusions="**/Persistence/Migrations/**" \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/coverage/**,**/bin/**,**/obj/**" \
            /d:sonar.qualitygate.wait=false \
            /d:sonar.qualitygate.timeout=300

      - name: Sonar backend | Restore .NET
        run: dotnet restore CashFlow.slnx

      - name: Sonar backend | Build under scanner
        run: dotnet build CashFlow.slnx -c Release --no-restore

      - name: Sonar frontend | Validate TypeScript analysis sources
        run: |
          test -s web/tsconfig.json
          test -s web/src/App.tsx
          test -s web/coverage/lcov.info

      - name: Sonar | Publish C# and TypeScript (built-in gate is informational)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Sonar | Validate local MVP end-to-end smoke contract (offline, no writes)
        run: python3 -m unittest discover -s .github/scripts -p 'test_local_e2e_mvp.py'

      - name: Sonar | Run local load probe unit tests (no live load in CI)
        run: python3 -m unittest discover -s .github/scripts -p 'test_local_load_probe.py'

      - name: Sonar | Verify local recovery drill safety tests (no service disruption in CI)
        run: python3 -m unittest discover -s .github/scripts -p 'test_local_recovery_drill.py'

      - name: Sonar | Verify local backup and restore safety tests (no database changes in CI)
        run: python3 -m unittest discover -s .github/scripts -p 'test_local_backup_restore_check.py'

      - name: Sonar | Verify projection SLO probe tests (no financial writes in CI)
        run: python3 -m unittest discover -s .github/scripts -p 'test_local_projection_slo.py'

      - name: Sonar | Validate read-only audit inventory policy tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_local_audit_inventory.py'

      - name: Sonar | Run CI severity policy tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_sonar_severity_gate.py'

      - name: Sonar | Enforce High/Blocker issue policy and quality metrics
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/sonar_severity_gate.py
