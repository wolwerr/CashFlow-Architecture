name: Temporary | Bootstrap npm lockfile
on:
  push:
    branches: [feat/unified-build-sonar-pipeline]
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ github.repository == 'wolwerr/CashFlow-Architecture' && github.ref == 'refs/heads/feat/unified-build-sonar-pipeline' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile without lifecycle scripts
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this feature branch
        shell: bash
        run: |
          test -s web/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "build(frontend): add resolved npm package-lock" || exit 0
          git push origin HEAD:feat/unified-build-sonar-pipeline
