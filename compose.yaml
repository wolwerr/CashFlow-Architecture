name: cashflow-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashflow_local_only}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d postgres"]
      interval: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cashflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cashflow_local_only}
    ports: ["127.0.0.1:15672:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_DB: postgres
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB_URL: jdbc:postgresql://postgres:5432/cashflow_keycloak
      KC_DB_USERNAME: cashflow
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-cashflow_local_only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_only}
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ./infra/local/keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:8081:8080"]
  transactions:
    build: {context: ., dockerfile: Backend/src/Services/Transactions/Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Authority: http://localhost:8081/realms/cashflow
      Authentication__Audience: cashflow-transactions-api
      KeycloakAuthorization__BaseUrl: http://keycloak:8080
      KeycloakAuthorization__Realm: cashflow
      KeycloakAuthorization__ClientId: cashflow-authorization-service
      KeycloakAuthorization__ClientSecret: ${KEYCLOAK_AUTHZ_CLIENT_SECRET:-}
      KeycloakManagement__Realm: cashflow
      KeycloakManagement__ClientId: cashflow-management-service
      KeycloakManagement__ClientSecret: ${KEYCLOAK_MGMT_CLIENT_SECRET:-}
      KeycloakManagement__BootstrapUsername: ${CASHFLOW_BOOTSTRAP_USERNAME:-cashflow.admin}
      CashFlowTelemetry__Enabled: ${CASHFLOW_OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CASHFLOW_OTEL_ENDPOINT:-http://otel-collector:4317}
      Transactions__ApplyMigrationsOnStartup: "true"
      Transactions__EnableOutboxPublisher: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__User: cashflow
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-cashflow_local_only}
      Authentication__MetadataAddress: http://keycloak:8080/realms/cashflow/.well-known/openid-configuration
      ConnectionStrings__Transactions: Host=postgres;Database=cashflow_transactions;Username=cashflow;Password=${POSTGRES_PASSWORD:-cashflow_local_only}
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      rabbitmq: {condition: service_started}
      otel-collector: {condition: service_started}
  consolidation:
    build: {context: ., dockerfile: Backend/src/Services/Consolidation/Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Consolidation: Host=postgres;Database=cashflow_consolidation;Username=cashflow;Password=${POSTGRES_PASSWORD:-cashflow_local_only}
      Authentication__Authority: http://localhost:8081/realms/cashflow
      Authentication__Audience: cashflow-consolidation-api
      Authentication__MetadataAddress: http://keycloak:8080/realms/cashflow/.well-known/openid-configuration
      KeycloakAuthorization__BaseUrl: http://keycloak:8080
      KeycloakAuthorization__Realm: cashflow
      KeycloakAuthorization__ClientId: cashflow-authorization-service
      KeycloakAuthorization__ClientSecret: ${KEYCLOAK_AUTHZ_CLIENT_SECRET:-}
      CashFlowTelemetry__Enabled: ${CASHFLOW_OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CASHFLOW_OTEL_ENDPOINT:-http://otel-collector:4317}
      Consolidation__ApplyMigrationsOnStartup: "true"
      Consolidation__EnableConsumer: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__User: cashflow
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-cashflow_local_only}
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      rabbitmq: {condition: service_started}
      otel-collector: {condition: service_started}
  web:
    build: {context: ., dockerfile: Frontend/Dockerfile}
    environment:
      TRANSACTIONS_UPSTREAM: transactions:8080
      CONSOLIDATION_UPSTREAM: consolidation:8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [transactions, consolidation]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/local/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [loki, tempo]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/local/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [otel-collector]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local.yaml"]
    volumes:
      - ./infra/local/observability/loki.yaml:/etc/loki/local.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/local.yaml"]
    volumes:
      - ./infra/local/observability/tempo.yaml:/etc/tempo/local.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${CASHFLOW_GRAFANA_PASSWORD:?Set a unique local Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/local/observability/datasources.yaml:/etc/grafana/provisioning/datasources/cashflow.yaml:ro
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
volumes:
  pgdata:
  rabbitdata:
      - ./infra/local/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [loki, tempo]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/local/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [otel-collector]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local.yaml"]
    volumes:
      - ./infra/local/observability/loki.yaml:/etc/loki/local.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/local.yaml"]
    volumes:
      - ./infra/local/observability/tempo.yaml:/etc/tempo/local.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${CASHFLOW_GRAFANA_PASSWORD:?Set a unique local Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/local/observability/datasources.yaml:/etc/grafana/provisioning/datasources/cashflow.yaml:ro
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
