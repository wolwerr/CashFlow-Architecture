apiVersion: 1
datasources:
  - name: CashFlow Prometheus
    uid: cashflow-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: CashFlow Loki
    uid: cashflow-loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: CashFlow Tempo
    uid: cashflow-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
